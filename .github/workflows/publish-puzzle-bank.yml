name: Publish puzzle-bank API and WebAssembly solver
on:
  push:
    branches: [main]
    paths:
      - 'puzzle_bank/unique/v1/minimal/size_*.json'
      - 'puzzle_bank/curated/v1/**'
      - 'web/**'
      - 'python_scripts/puzzle_bank/export_api_metadata.py'
      - '.github/workflows/publish-puzzle-bank.yml'
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          lfs: true
      - name: Download puzzle-bank LFS content
        run: |
          git lfs install --local
          git lfs pull --include="puzzle_bank/unique/v1/minimal/size_*.json,puzzle_bank/curated/v1/size_*.json" --exclude=""
          git lfs checkout
          python3 - <<'PY'
          import json
          from pathlib import Path
          for family in ('unique/v1/minimal', 'curated/v1'):
              for size in range(4, 10):
                  path = Path('puzzle_bank') / family / f'size_{size}.json'
                  try:
                      bank = json.loads(path.read_text(encoding='utf-8'))
                  except (ValueError, OSError) as exc:
                      raise RuntimeError(f'LFS content unavailable for {path}') from exc
                  assert bank.get('size') == size, path
          PY
      - name: Resolve latest published release
        id: release
        uses: actions/github-script@v8
        with:
          script: |
            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            core.setOutput('tag', release.tag_name);
            core.info(`Building website solver from release ${release.tag_name}`);
      - name: Check out released solver separately
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: scratch/release-solver
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: latest
      - name: Compile and smoke-test released browser solver
        working-directory: scratch/release-solver
        run: |
          emcc -O3 -flto -Isrc src/*.c web/wasm_api.c \
            -s INVOKE_RUN=0 -s MODULARIZE=1 \
            -s EXPORT_NAME=createSkyscraperSolver \
            -s EXPORTED_FUNCTIONS='["_solve_web"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall"]' \
            -s ALLOW_MEMORY_GROWTH=1 -s INITIAL_MEMORY=67108864 \
            -o web/solver.js
          node web/smoke_test.cjs
      - name: Build static website
        run: |
          mkdir -p public/assets/solver
          cp scratch/release-solver/web/solver.js scratch/release-solver/web/solver.wasm public/assets/solver/
          python3 web/build_site.py --output public
          test -s public/assets/index.json
          test -s public/assets/puzzles/puzzles.js
          test -s public/assets/puzzles/curated/v1/7/extreme_plus.json
          test -s public/demo/index.html
          test -s public/curated/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path('public/assets/puzzles/curated/v1')
          metadata = json.loads((base / 'metadata.json').read_text())
          statistics = json.loads((base / 'statistics.json').read_text())
          assert metadata['curated_version'] == 'v1'
          assert statistics['curated_version'] == 'v1'
          for size, counts in metadata['sizes'].items():
              for level, count in counts.items():
                  shard = base / size / (level + '.json')
                  assert shard.exists() == (count > 0), shard
          PY
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
