name: PR website preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'web/**'
      - 'src/**'
      - 'puzzle_bank/**'
      - '.github/workflows/preview-pages.yml'
      - '.github/workflows/publish-puzzle-bank.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    environment:
      name: github-pages
      url: https://tonycongqianwang.github.io/SkyscraperSolver/previews/pr-${{ github.event.pull_request.number }}/
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'closed' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Build website
        run: |
          mkdir -p public/solver/demo
          emcc -O3 -flto -Isrc src/*.c web/wasm_api.c \
            -s INVOKE_RUN=0 -s MODULARIZE=1 \
            -s EXPORT_NAME=createSkyscraperSolver \
            -s EXPORTED_FUNCTIONS='["_solve_web"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall"]' \
            -s ALLOW_MEMORY_GROWTH=1 -s INITIAL_MEMORY=67108864 \
            -o public/solver/solver.js
          cp web/index.html public/solver/demo/index.html
          cp web/worker.js web/solver-info.html public/solver/
          mv public/solver/solver-info.html public/solver/index.html
          cp web/home.html public/index.html
          mkdir -p public/puzzle-bank/v1 public/puzzle-bank/unique/v2/minimal public/puzzle-bank/curated/v1
          cp -a puzzle_bank/unique/v1/. public/puzzle-bank/v1/
          cp -a puzzle_bank/unique/v2/minimal/. public/puzzle-bank/unique/v2/minimal/
          find puzzle_bank/curated/v1 -maxdepth 1 -type f \( -name 'size_*.json' -o -name 'statistics.json' \) -exec cp {} public/puzzle-bank/curated/v1/ \;
          python3 web/generate_directory_indexes.py public/puzzle-bank
          cp web/curated.html public/puzzle-bank/curated/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          for n in range(4,10):
              with Path(f'public/puzzle-bank/unique/v2/minimal/size_{n}.json').open() as f:
                  assert json.load(f)['size'] == n
          PY
          touch public/.nojekyll
      - name: Upload browsable site artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: public/
          retention-days: 14
      - name: Assemble production plus preview
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mv public preview-build
          mkdir -p public
          # Retain the currently deployed production website. Do not overwrite it.
          curl --fail --location --retry 3 \
            https://tonycongqianwang.github.io/SkyscraperSolver/ -o /tmp/production-index.html
          # The production tree is reconstructed from main rather than fetched from
          # the live site, so no crawling of public JSON or WASM is necessary.
          git fetch origin main
          git worktree add --detach production-tree origin/main
          mkdir -p public/solver/demo public/puzzle-bank/v1 public/puzzle-bank/unique/v2/minimal public/puzzle-bank/curated/v1
          cp production-tree/web/home.html public/index.html
          cp production-tree/web/index.html public/solver/demo/index.html
          cp production-tree/web/worker.js public/solver/worker.js
          cp production-tree/web/solver-info.html public/solver/index.html
          cp -a production-tree/puzzle_bank/unique/v1/. public/puzzle-bank/v1/
          cp -a production-tree/puzzle_bank/unique/v2/minimal/. public/puzzle-bank/unique/v2/minimal/
          find production-tree/puzzle_bank/curated/v1 -maxdepth 1 -type f \( -name 'size_*.json' -o -name 'statistics.json' \) -exec cp {} public/puzzle-bank/curated/v1/ \;
          python3 web/generate_directory_indexes.py public/puzzle-bank
          cp production-tree/web/curated.html public/puzzle-bank/curated/index.html
          # Production WASM must be compiled from main, not the PR.
          emcc -O3 -flto -Iproduction-tree/src production-tree/src/*.c production-tree/web/wasm_api.c \
            -s INVOKE_RUN=0 -s MODULARIZE=1 \
            -s EXPORT_NAME=createSkyscraperSolver \
            -s EXPORTED_FUNCTIONS='["_solve_web"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall"]' \
            -s ALLOW_MEMORY_GROWTH=1 -s INITIAL_MEMORY=67108864 \
            -o public/solver/solver.js
          if [[ "${{ github.event.action }}" != "closed" ]]; then
            mkdir -p "public/previews/pr-$PR_NUMBER"
            cp -a preview-build/. "public/previews/pr-$PR_NUMBER/"
          fi
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
        if: github.event_name == 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'pull_request'
        with:
          path: public
      - uses: actions/deploy-pages@v4
        if: github.event_name == 'pull_request'
