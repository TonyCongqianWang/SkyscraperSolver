name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run every check regardless of changed files (use before releases)
        type: boolean
        default: true
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.filter.outputs.native }}
      python: ${{ steps.filter.outputs.python }}
      python_solver: ${{ steps.filter.outputs.python_solver }}
      wasm: ${{ steps.filter.outputs.wasm }}
      pages: ${{ steps.filter.outputs.pages }}
      spsa: ${{ steps.filter.outputs.spsa }}
      full: ${{ steps.force.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether to force full suite
        id: force
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.full_suite }}
        run: |
          if [[ "$EVENT" == "release" || ("$EVENT" == "workflow_dispatch" && "$FORCE" == "true") ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            native:
              - 'src/**'
              - 'Makefile'
              - 'benchmark_sets/**'
              - 'python_scripts/verify_consistency.py'
              - 'python_scripts/tests/config/lookahead_depth_ci.c'
              - 'python_solver/**'
              - '.github/workflows/ci.yml'
            python:
              - 'python_scripts/**'
              - 'puzzle_bank/curated/**'
              - '.github/workflows/ci.yml'
            python_solver:
              - 'python_solver/**'
            wasm:
              - 'src/**'
              - 'web/wasm_api.c'
              - 'web/worker.js'
              - 'web/smoke_test.cjs'
              - '.github/workflows/ci.yml'
            pages:
              - 'web/**'
              - 'puzzle_bank/curated/**'
              - 'puzzle_bank/unique/v1/**'
              - '.github/workflows/ci.yml'
            spsa:
              - 'src/**'
              - 'setup_and_tune.sh'
              - 'generate_spsa_datasets.sh'
              - 'python_scripts/dataset_generation/**'
              - '.github/workflows/ci.yml'

  norminette-formatting:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - run: pip install norminette
      - name: Check native formatting
        run: |
          python -m norminette src/*.c src/*.h || true
          OUTPUT=$(python -m norminette -f json src/*.c src/*.h) || true
          ERRORS=$(echo "$OUTPUT" | grep -o '"level":"Error"' | wc -l || true)
          echo "Norminette errors: $ERRORS"
          test "$ERRORS" -eq 0

  verify-correctness:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Build and verify
        run: |
          make
          make test

  verify-deep-lookahead:
    name: Verify lookahead tier depths 3, 2, 1
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Build normal solver with per-tier lookahead depths 3, 2, 1
        run: |
          cp python_scripts/tests/config/lookahead_depth_ci.c src/lookahead_depth.c
          make
      - name: Verify Python solver datasets with the normal solver
        run: |
          for dataset in benchmark_sets/benchmarkSet7_python20.txt \
                         benchmark_sets/benchmarkSet8_python20.txt \
                         benchmark_sets/benchmarkSet9_minimal20.txt; do
            counts="benchmark_sets/_num_solutions_$(basename "$dataset")"
            make test VERIFY_ARGS="$dataset --expected $counts"
          done

  python-solver-verification:
    name: Verify Python solver (${{ matrix.backend }})
    needs: changes
    if: needs.changes.outputs.python_solver == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        backend: [z3, cpsat]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python_solver/requirements.txt
      - name: Install solver dependencies
        run: python -m pip install -r python_solver/requirements.txt pytest
      - name: Run backend regression tests
        run: python -m pytest python_scripts/tests/test_${{ matrix.backend }}_backend.py python_scripts/tests/test_python_solver_verification.py -q
      - name: Verify exhaustive counts for sizes 7, 8 and 9
        run: python python_solver/verify.py --backend ${{ matrix.backend }} --case-timeout 10 --total-timeout 180

  pytest:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python_scripts/dataset_generation/requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install pytest
          python -m pip install -r python_scripts/dataset_generation/requirements.txt
      - name: Run Python tests
        run: python -m pytest python_scripts/tests -q

  spsa-tuning:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.spsa == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install solver dependencies
        run: |
          if [ -f python_solver/requirements.txt ]; then pip install -r python_solver/requirements.txt; fi
      - name: Verify setup and tuning
        run: bash setup_and_tune.sh

  wasm-build:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Compile browser solver
        run: |
          emcc -O3 -flto -Isrc src/*.c web/wasm_api.c \
            -s INVOKE_RUN=0 -s MODULARIZE=1 \
            -s EXPORT_NAME=createSkyscraperSolver \
            -s EXPORTED_FUNCTIONS='["_solve_web"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall"]' \
            -s ALLOW_MEMORY_GROWTH=1 -s INITIAL_MEMORY=67108864 \
            -o web/solver.js
      - run: node web/smoke_test.cjs

  pages-index-check:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.pages == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check static site and asset export
        run: |
          python3 -m unittest python_scripts.tests.test_web_assets -v
          node --input-type=module --check < web/puzzles.js
          node --check web/worker.js
          node web/test_puzzles.cjs
          node web/test_demo_theme.cjs

  ci-gate:
    if: always()
    needs: [changes, norminette-formatting, verify-correctness, verify-deep-lookahead, python-solver-verification, pytest, spsa-tuning, wasm-build, pages-index-check]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all selected checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json,sys
          jobs=json.load(sys.stdin)
          failed={name: job["result"] for name,job in jobs.items() if job["result"] not in ("success","skipped")}
          print("CI job results:", {name: job["result"] for name,job in jobs.items()})
          if failed:
              print("Unsuccessful jobs:", failed)
              sys.exit(1)
          '
