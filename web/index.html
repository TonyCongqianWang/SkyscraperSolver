<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skyscraper Solver / WASM</title>
<style>
:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;background:#090909;color:#f0f0f0}
*{box-sizing:border-box}body{max-width:850px;margin:38px auto;padding:0 20px}
h1{font-size:1.45rem;font-weight:600}p{line-height:1.6;color:#c9c9c9}
label{display:block;margin:0 0 8px}
.input-row{display:flex;align-items:flex-end;gap:12px;margin-top:24px}
.input-field{flex:1;min-width:0}
.input-row button{flex:none;margin:0;min-height:75px}
.hint{font-size:.85rem;margin-top:12px}
@media(max-width:620px){.input-row{flex-wrap:wrap}.input-field{flex:1 1 100%}.input-row button{min-height:0}}
textarea{display:block;width:100%;min-height:75px;padding:12px;background:#171717;color:#fafafa;border:1px solid #696969;border-radius:4px;font:inherit;resize:vertical}
textarea:focus{outline:1px solid white}
button{margin:20px 0;padding:11px 25px;border:1px solid #eee;border-radius:4px;background:#f4f4f4;color:#080808;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
pre{white-space:pre;overflow-x:auto;line-height:1.6;font-size:clamp(12px,2.5vw,17px)}
#status{min-height:1.5em;color:#fff;white-space:pre-line}#status.error{color:#ff9c9c}
small{font-size:.85rem;font-weight:400;color:#999}
</style>
</head>
<body>
<h1>Skyscraper Solver <small>/ WebAssembly</small></h1>
<div class="input-row">
  <div class="input-field"><label for="clues">CLUES</label>
    <textarea id="clues" rows="2" spellcheck="false">1 3 3 0 0 0 0 2 0 0 0 0 0 0 0 0</textarea></div>
  <div class="input-field"><label for="grid">GRID (OPTIONAL)</label>
    <textarea id="grid" rows="2" spellcheck="false" placeholder="Leave empty for no givens"></textarea></div>
  <button id="solve">Solve!</button>
</div>
<p class="hint">Clues: 4 × N space-separated values (N = 4–9), ordered Top (→), Bottom (→), Left (↓), Right (↓).<br>
Grid: N × N values, row by row (→, then ↓). Use 0 for missing clues or empty cells.</p>
<p id="status" role="status" aria-live="polite"></p>
<pre id="output" aria-label="First solution"></pre>
<script>
const $=id=>document.getElementById(id);
let worker=null;
let feedbackTimer=null;
function numbers(source){
 const text=source.trim();
 if(!text)return [];
 const parts=text.split(/\s+/);
 if(parts.some(x=>!/^[0-9]+$/.test(x)))throw Error("Use only space-separated integers.");
 return parts.map(Number);
}
function ascii(n,clues,values){
 const show=v=>v?String(v):" ";
 const pad="    ",cluePad="      "; // Clue digits sit at cell centers, two columns past the left border.
 const top=cluePad+Array.from({length:n},(_,i)=>show(clues[i])).join("   ");
 const edge=pad+"+"+Array.from({length:n},()=> "---").join("+")+"+";
 const rows=[top,edge];
 for(let r=0;r<n;r++){
  let cells=Array.from({length:n},(_,c)=>show(values[r*n+c])).map(v=>" "+v+" ").join("|");
  rows.push(" "+show(clues[2*n+r])+"  |"+cells+"|  "+show(clues[3*n+r]));
  rows.push(edge);
 }
 rows.push(cluePad+Array.from({length:n},(_,i)=>show(clues[n+i])).join("   "));
 return rows.join("\n");
}
$("solve").onclick=()=>{
 try{
  clearTimeout(feedbackTimer);
  $("status").textContent=""; $("output").textContent="";
  const clues=numbers($("clues").value),n=clues.length/4,grid=numbers($("grid").value);
  if(!Number.isInteger(n)||n<4||n>9||clues.some(x=>x>n))
   throw Error("Expected: 4 × N clues, each between 0 and N (N = 4–9; 16, 20, 24, 28, 32 or 36 clues).\nGot: "+clues.length+" clues"+(Number.isInteger(n)&&n>=4&&n<=9&&clues.some(x=>x>n)?" (some values exceed N)":"")+".");
  if(grid.length&&grid.length!==n*n)throw Error("Grid requires exactly N × N values.");
  if(grid.some(x=>x>n))throw Error("Grid numbers must be between 0 and N.");
  worker?.terminate();
  worker=new Worker("../worker.js");
  $("solve").disabled=true;$("status").className="";$("status").textContent="Solving…";$("output").textContent="";
  worker.onmessage=({data})=>{
   worker?.terminate();worker=null;$("solve").disabled=false;
   if(data.error||data.response?.startsWith("ERR:")){
    $("status").className="error";$("status").textContent=data.error||data.response;return;
   }
   const [countText,nodes,sizeText,solution=""]=data.response.split("|");
   const count=Number(countText),size=Number(sizeText);
   if(count===0){$("status").textContent="No solutions.";return;}
   if(size!==n||solution.length!==n*n){$("status").className="error";$("status").textContent="Invalid solver response.";return;}
   $("status").textContent=(count===1?"Unique solution.":"Not unique: at least two solutions.")+" Nodes visited: "+nodes;
   $("output").textContent=ascii(n,clues,[...solution].map(Number));
  };
  worker.onerror=e=>{worker?.terminate();worker=null;$("solve").disabled=false;$("status").className="error";$("status").textContent=e.message};
  worker.postMessage({clues:clues.join(" "),grid:grid.join(" "),limit:2});
 }catch(error){$("solve").disabled=false;$("status").className="error";
  const message=error.message;
  feedbackTimer=setTimeout(()=>$("status").textContent=message, 120);
 }
};
</script>
</body></html>
