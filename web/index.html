<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skyscraper Solver — WebAssembly</title>
<style>
:root{font-family:system-ui,sans-serif;color:#272018;background:#f7f1e7}
body{max-width:790px;margin:28px auto;padding:0 18px}
h1{margin-bottom:8px}p{line-height:1.55}
label{display:block;font-weight:700;margin:18px 0 7px}
textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bca98b;border-radius:8px;background:#fffaf2;font:15px/1.6 ui-monospace,monospace;resize:vertical}
button{background:#b58741;color:#17110b;font-size:17px;font-weight:700;border:0;border-radius:8px;padding:12px 22px;cursor:pointer;margin:18px 0}
button:disabled{opacity:.6;cursor:wait}
#status{min-height:25px}#status.error{color:#9e251c}
#board{display:grid;grid-template-columns:repeat(var(--side),minmax(0,1fr));max-width:520px;gap:3px;margin:18px 0}
#board .cell,#board .clue,#board .blank{min-height:32px;aspect-ratio:1;display:grid;place-items:center}
#board .cell{background:#fffaf0;border:1px solid #c9bca5;border-radius:4px;font-weight:700}
#board .clue{color:#76582b;font-weight:700}
code{word-break:break-word}
</style>
</head><body>
<h1>Skyscraper Solver <small>(WebAssembly)</small></h1>
<p>Runs the C solver locally in your browser. Enter <b>4×N clues</b> as space-separated digits in this order: <b>top, bottom, left, right</b> (each group has N entries). Use <b>0</b> for a missing clue. Sizes 4–9.</p>
<label for="clues">Visibility clues</label>
<textarea id="clues" rows="3" spellcheck="false">1 3 3 0 0 0 0 2 0 0 0 0 0 0 0 0</textarea>
<label for="grid">Initial grid (optional)</label>
<textarea id="grid" rows="3" spellcheck="false" placeholder="N×N values row by row; 0 for blank. Leave empty for no givens."></textarea>
<button id="solve">Solve!</button>
<p id="status" role="status" aria-live="polite"></p><div id="board" aria-label="First solution"></div>
<p id="stats"></p>
<script>
const cluesEl=document.querySelector("#clues"),gridEl=document.querySelector("#grid"),
  solveBtn=document.querySelector("#solve"),statusEl=document.querySelector("#status"),
  board=document.querySelector("#board"),stats=document.querySelector("#stats");
let worker;
const tokens=(s)=>s.trim()?s.trim().split(/\s+/).map(Number):[];
function validate(){
  const clues=tokens(cluesEl.value),n=clues.length/4,grid=tokens(gridEl.value);
  if(!Number.isInteger(n)||n<4||n>9||clues.some(v=>!Number.isInteger(v)||v<0||v>n))
    throw Error("Provide 4×N clue numbers (N = 4–9), all between 0 and N.");
  if(grid.length&&grid.length!==n*n)throw Error("Grid must contain exactly N×N values, or be empty.");
  if(grid.some(v=>!Number.isInteger(v)||v<0||v>n))throw Error("Grid values must be integers between 0 and N.");
  return {n,clues,grid};
}
function render(n,values,clues){
  board.replaceChildren();board.style.setProperty("--side",n+2);
  const cell=(text,cls)=>{const el=document.createElement("div");el.className=cls;el.textContent=text||"";board.append(el)};
  for(let r=-1;r<=n;r++)for(let c=-1;c<=n;c++){
    if(r===-1&&c>=0)cell(clues[c]||"","clue");
    else if(r===n&&c>=0)cell(clues[n+c]||"","clue");
    else if(c===-1&&r>=0&&r<n)cell(clues[2*n+r]||"","clue");
    else if(c===n&&r>=0&&r<n)cell(clues[3*n+r]||"","clue");
    else if(r>=0&&r<n&&c>=0&&c<n)cell(values[r*n+c],"cell");
    else cell("","blank");
  }
}
solveBtn.onclick=()=>{
  try{
    const {n,clues,grid}=validate();
    if(worker)worker.terminate();
    worker=new Worker("./worker.js");
    solveBtn.disabled=true;statusEl.className="";statusEl.textContent="Solving locally…";
    stats.textContent="";board.replaceChildren();
    worker.onmessage=({data})=>{
      solveBtn.disabled=false;worker.terminate();worker=null;
      if(data.error||data.response?.startsWith("ERR:")){
        statusEl.className="error";statusEl.textContent=data.error||data.response;return;
      }
      const [countStr,nodesStr,sizeStr,solution=""]=data.response.split("|");
      const count=Number(countStr),size=Number(sizeStr);
      if(count===0){statusEl.textContent="No solution found.";return;}
      statusEl.textContent=count===1?"Unique solution.":"Not unique: at least two solutions exist.";
      if(solution.length!==size*size)throw Error("Unexpected solver solution format");
      render(size,[...solution].map(Number),clues);
      stats.textContent="Solutions found (search limit 2): "+count+" · Nodes visited: "+nodesStr;
    };
    worker.onerror=(e)=>{solveBtn.disabled=false;statusEl.className="error";statusEl.textContent="WebAssembly worker failed: "+e.message;worker?.terminate();worker=null};
    worker.postMessage({clues:clues.join(" "),grid:grid.join(" "),limit:2});
  }catch(e){solveBtn.disabled=false;statusEl.className="error";statusEl.textContent=e.message;}
};
</script></body></html>
